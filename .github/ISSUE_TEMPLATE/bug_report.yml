name: Bug report
description: Report a reproducible defect in the compiler, CLI, theme, or contracts.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Package and version
      description: Include the affected package name and exact version or commit.
      placeholder: "@402v/html-kit-core 0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Include operating system, Node.js version, and npm version.
      placeholder: "Ubuntu 24.04, Node 24.x, npm 11.x"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide bounded source files and exact commands with private data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the structured error code and sanitized output when available.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private content, and local absolute paths.
          required: true
        - label: This report is not a security vulnerability.
          required: true
