name: Release npm packages

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify signed tag identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      version: ${{ steps.verify.outputs.version }}
      repository: ${{ steps.verify.outputs.repository }}
      workflow: ${{ steps.verify.outputs.workflow }}
      ref: ${{ steps.verify.outputs.ref }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Check out pushed tag without repository credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact verified annotated tag bound to HEAD
        id: verify
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/release.mjs verify-tag

  release:
    name: Prepare and resumably publish verified tarballs
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - name: Check out the verified commit without repository credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - name: Require checkout HEAD to remain the verified commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install reviewed npm with trusted publishing support
        run: npm install --global npm@11.12.1
      - name: Install from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run full tests
        run: npm test
      - name: Capture package, license, and forbidden-content gate
        run: npm run --silent pack:check > "$RUNNER_TEMP/pack-gate.json"
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Prepare and verify all persistent release tarballs
        env:
          PACK_GATE_PATH: ${{ runner.temp }}/pack-gate.json
          RELEASE_PLAN_PATH: ${{ runner.temp }}/release-plan.json
          RELEASE_TARBALL_DIR: ${{ runner.temp }}/release-tarballs
          RELEASE_VERSION: ${{ needs.verify-tag.outputs.version }}
          RELEASE_SOURCE_REPOSITORY: ${{ needs.verify-tag.outputs.repository }}
          RELEASE_SOURCE_WORKFLOW: ${{ needs.verify-tag.outputs.workflow }}
          RELEASE_SOURCE_REF: ${{ needs.verify-tag.outputs.ref }}
          RELEASE_SOURCE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_SOURCE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: node .github/scripts/release.mjs prepare
      # External gate: configure npm trusted publishers for this workflow,
      # repository, environment, and all three packages before pushing a tag.
      - name: Resume trusted publishing with integrity and provenance checks
        env:
          RELEASE_PLAN_PATH: ${{ runner.temp }}/release-plan.json
          RELEASE_VERSION: ${{ needs.verify-tag.outputs.version }}
          RELEASE_SOURCE_REPOSITORY: ${{ needs.verify-tag.outputs.repository }}
          RELEASE_SOURCE_WORKFLOW: ${{ needs.verify-tag.outputs.workflow }}
          RELEASE_SOURCE_REF: ${{ needs.verify-tag.outputs.ref }}
          RELEASE_SOURCE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_SOURCE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: node .github/scripts/release.mjs publish
